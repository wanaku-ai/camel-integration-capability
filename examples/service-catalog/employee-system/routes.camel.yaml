- route:
    id: ai-tool-get-employee-information
    from:
      uri: ai-tool:get-employee-information
      parameters:
        description: "Fetches core profile data for a specific employee (eg. name, id, level and days in level)."
        parameter.employeeId: int
        parameter.employeeId.description: "The employee ID to retrieve information for"
    steps:
      - setHeader:
          name: EMPLOYEE_ID
          simple: ${header.employeeId}
      - to: direct:employee-information
- route:
    id: ai-tool-get-employee-reviews
    from:
      uri: ai-tool:get-employee-reviews
      parameters:
        description: "Displays all past and current performance reviews, ratings, and manager feedback."
        parameter.employeeId: int
        parameter.employeeId.description: "The employee ID to get the review information for"
    steps:
      - setHeader:
          name: EMPLOYEE_ID
          simple: ${header.employeeId}
      - to: direct:employee-reviews
- route:
    id: ai-tool-get-employee-compensation
    from:
      uri: ai-tool:get-employee-compensation
      parameters:
        description: "Fetches current and historical pay details for the selected employee."
        parameter.employeeId: int
        parameter.employeeId.description: "The employee ID to fetch the information for"
    steps:
      - setHeader:
          name: EMPLOYEE_ID
          simple: ${header.employeeId}
      - to: direct:employee-compensation
- route:
    id: get-employee-information
    description: Retrieve employee basic information
    from:
      uri: direct:employee-information
      steps:
        - setHeader:
            constant: GET
            name: CamelHttpMethod
        - toD:
            uri: http://employee-backend-service:8081/employee/${header.EMPLOYEE_ID}/information
            parameters:
              bridgeEndpoint: true
        - convertBodyTo:
            type: String
        - choice:
            otherwise:
              steps:
                - log:
                    message: ${body}
            when:
              - steps:
                  - setBody:
                      constant:
                        expression: '{"error":"Employee information for executives is restricted"}'
                  - log:
                      message: "Retrieved employee reviews for ID: ${header.EMPLOYEE_ID}"
                simple:
                  expression: ${body} contains 'Z10'
- route:
    id: get-employee-reviews
    description: Retrieve employee performance reviews
    from:
      uri: direct:employee-reviews
      steps:
        - setHeader:
            constant: GET
            name: CamelHttpMethod
        - toD:
            uri: http://employee-backend-service:8081/employee/${header.EMPLOYEE_ID}/reviews
            parameters:
              bridgeEndpoint: true
        - log:
            message: "Retrieved employee reviews for ID: ${header.EMPLOYEE_ID}"
        - convertBodyTo:
            type: String
- route:
    id: get-employee-compensation
    description: Retrieve employee compensation details
    from:
      uri: direct:employee-compensation
      steps:
        - setHeader:
            constant: GET
            name: CamelHttpMethod
        - toD:
            uri: http://employee-backend-service:8081/employee/${header.EMPLOYEE_ID}/compensation
            parameters:
              bridgeEndpoint: true
        - log:
            message: "Retrieved employee compensation for ID: ${header.EMPLOYEE_ID}"
        - convertBodyTo:
            type: String
- route:
    id: get-employee-complete-profile
    description: Retrieve complete employee profile (all three endpoints)
    from:
      uri: direct:employee-complete-profile
      steps:
        - log:
            message: "Fetching complete profile for employee ID: ${header.EMPLOYEE_ID}"
        - setProperty:
            name: employeeId
            simple: ${header.EMPLOYEE_ID}
        - to:
            uri: direct:employee-information
        - convertBodyTo:
            type: String
        - setProperty:
            name: employeeInformation
            simple: ${body}
        - setHeader:
            name: EMPLOYEE_ID
            simple: ${exchangeProperty.employeeId}
        - to:
            uri: direct:employee-reviews
        - convertBodyTo:
            type: String
        - setProperty:
            name: employeeReviews
            simple: ${body}
        - setHeader:
            name: EMPLOYEE_ID
            simple: ${exchangeProperty.employeeId}
        - to:
            uri: direct:employee-compensation
        - convertBodyTo:
            type: String
        - setProperty:
            name: employeeCompensation
            simple: ${body}
        - setBody:
            simple: |
              {
                "information": ${exchangeProperty.employeeInformation},
                "reviews": ${exchangeProperty.employeeReviews},
                "compensation": ${exchangeProperty.employeeCompensation}
              }
        - log:
            message: "Complete profile retrieved for employee ID:
              ${exchangeProperty.employeeId}"
