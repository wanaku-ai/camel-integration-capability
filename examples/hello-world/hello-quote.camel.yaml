- route:
    id: route-3104
    from:
      uri: ai-tool:sends-greeting
      parameters:
        description: "Sends a greeting message to show that the application is working"
        parameter.wanaku_body: string
        parameter.wanaku_body.description: "The greeting message to send"
    steps:
      - log:
          message: Hello ${body}
      - setBody:
          simple: Hello ${body} from ${routeId}
