name: release-artifacts

on:
  workflow_dispatch:
    inputs:
      currentDevelopmentVersion:
        description: 'The current development version'
        required: true

env:
  CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY || 'quay.io' }}
  CONTAINER_GROUP: ${{ vars.CONTAINER_GROUP || 'wanaku' }}

jobs:
  build:
    env:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: camel-integration-capability-${{ github.event.inputs.currentDevelopmentVersion }}
      - name: Set up JDK 21
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml
      - name: Set arch
        id: arch
        run: echo "arch=$(uname -m)" >> $GITHUB_OUTPUT
      - name: Login to Container Registry
        if: env.QUAY_USERNAME != '' && env.QUAY_PASSWORD != ''
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Build containers
        if: env.QUAY_USERNAME != '' && env.QUAY_PASSWORD != ''
        run: podman build -t ${{ env.CONTAINER_REGISTRY }}/${{ env.CONTAINER_GROUP }}/camel-integration-capability:${{ github.event.inputs.currentDevelopmentVersion }}-${{ steps.arch.outputs.arch }} .
      - name: Push containers
        if: env.QUAY_USERNAME != '' && env.QUAY_PASSWORD != ''
        run: podman push ${{ env.CONTAINER_REGISTRY }}/${{ env.CONTAINER_GROUP }}/camel-integration-capability:${{ github.event.inputs.currentDevelopmentVersion }}-${{ steps.arch.outputs.arch }}

  createManifests:
    env:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Login to Container Registry
        if: env.QUAY_USERNAME != '' && env.QUAY_PASSWORD != ''
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}
      - name: Build and Push Manifests
        if: env.QUAY_USERNAME != '' && env.QUAY_PASSWORD != ''
        run: |
          chmod +x build-manifests.sh
          ./build-manifests.sh ${{ github.event.inputs.currentDevelopmentVersion }} "${CONTAINER_REGISTRY}/${CONTAINER_GROUP}"
